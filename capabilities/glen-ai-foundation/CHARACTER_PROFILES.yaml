version: 1
subcontract: glen-ai-character-profiles
parent_capability: glen-ai-foundation
status: canonical-design-v1
canonical_document: architecture/GLEN_AI_CHARACTER_PROFILES.md

default_profile:
  profile_id: glen
  display_name: Glen
  presentation: masculine
  default_voice_presentation: masculine
  global_fallback: true

canonical_profiles:
  - profile_id: glen
    display_name: Glen
    role: global-default
    presentation: masculine
    default_voice_presentation: masculine
  - profile_id: anji
    display_name: Anji
    canonical_spelling: Anji
    common_spelling_note: intentionally distinct from Angie
    role: first-class-female-alternative
    presentation: feminine
    default_voice_presentation: feminine
    real_person_based: true
    consent_status: approved-in-principle-requires-durable-production-record
    required_consent_modalities:
      - likeness
      - avatar-image-transformation
      - synthetic-or-cloned-voice
    requirements:
      - coherent-personality-profile
      - same-capability-as-glen
      - same-authority-and-safety-boundaries-as-glen
      - durable-scoped-consent-record-before-production-use
      - clear-ai-person-identity-separation

profile_fields:
  required:
    - profile-id
    - version
    - display-name
    - personality-dimensions
    - voice-policy
  optional:
    - presentation-gender-or-identity
    - avatar-reference
    - supported-voice-alternatives
    - locale-language-accent-preferences
    - emotional-expressiveness
    - humor-playfulness
    - context-suitability-tags
    - accessibility-variants
    - disclosure-metadata
    - consent-record-reference
    - product-availability
    - feature-flag-state

resolution_precedence:
  - explicit-user-session-selection
  - saved-user-preference
  - explicit-context-default
  - product-default
  - global-glen-fallback

invariants:
  - character-does-not-change-capability
  - character-does-not-change-authorization
  - character-does-not-change-ai-authority
  - character-does-not-change-tool-permissions
  - character-does-not-change-evidence-truth
  - character-does-not-change-constraint-results
  - character-does-not-create-professional-or-government-authority
  - voice-does-not-change-user-intent-semantics
  - profile-switch-does-not-create-parallel-orchestration-state
  - user-choice-overrides-context-default-unless-auto-switching-opted-in
  - personality-style-must-not-intentionally-change-material-facts
  - real-person-likeness-does-not-make-ai-output-human-authored
  - real-person-likeness-does-not-create-personal-endorsement
  - consent-is-modality-and-scope-specific

personality_dimensions:
  - directness
  - warmth
  - formality
  - brevity-detail
  - humor
  - enthusiasm
  - coaching-tendency
  - next-step-initiative
  - local-language-code-switching
  - emotional-expressiveness

voice_rules:
  character-and-voice-separable: true
  provider-neutral: true
  allow-accessibility-variants: true
  allow-language-accent-variants: true
  voice-fallback-cannot-change-authority: true
  real-person-voice-requires-rights-consent-and-disclosure: true

real_person_consent_contract:
  production_use_requires_durable_record: true
  required_fields:
    - consent-record-id
    - character-profile-id
    - consent-subject-or-rights-holder-reference
    - covered-modalities
    - approved-products-channels-and-purposes
    - effective-date
    - version
    - derivative-transformation-permission
    - provider-processing-permission-where-relevant
    - disclosure-requirements
    - modification-restriction-history
    - revocation-or-termination-state
    - evidence-provenance-reference
  private-artifacts-not-in-public-profile-or-prompts: true
  scope_specific: true
  face-consent-does-not-imply-voice-consent: true
  likeness-consent-does-not-imply-biography-consent: true
  revoked-or-expired-consent-fails-closed-for-new-dependent-generation: true

anji_consent_policy:
  approved_real_person_based_character: true
  production_record_required: true
  must_cover:
    - likeness-use
    - synthetic-or-cloned-voice-use
    - avatar-image-transformation-use
    - product-channel-scope
    - advertising-promotion-endorsement-limits
    - consent-evidence-provenance
    - modification-and-revocation-handling
  public_profile_uses_stable-consent-reference-not-private-documentation: true

disclosure_identity_separation:
  must_make-clear-anji-is-ai: true
  must_not_imply:
    - real-person-live-participation
    - ai-statements-are-real-person-statements
    - ai-actions-are-personally-performed-or-approved-by-real-person
    - real-person-likeness-grants-professional-government-financial-or-other-authority

biography_boundary:
  likeness-or-voice-consent-does-not-authorize-private-biography: true
  biography-requires-separate-purpose-approval: true
  private-communications-and-memories-excluded-by-default: true

context_default_rules:
  product-may-set-context-default: true
  context-default-affects-presentation-only: true
  unexpected-mid-session-switch-disallowed-without-user-opt-in: true

user_preferences:
  saved-character-allowed: true
  saved-voice-allowed: true
  separately-governed-preference-data: true
  must-be-removable-or-resettable: true
  easy-return-to-glen: true

skill_tool_independence:
  skills-belong-to-capabilities-not-characters: true
  profile-cannot-own-private-permission-escalating-skill-copy: true
  profile-change-cannot-change-read-write-classification: true
  profile-change-cannot-change-a1-a2-a3-mapping: true

orchestration:
  preserve-canonical-workflow-state-across-profile-switch: true
  profile-may-be-interaction-metadata: true

multimodal:
  supported-presentation-surfaces:
    - text
    - voice
    - avatar
    - animation
    - future-spatial-or-embodied-interface

product_adapter_may_define:
  - available-profiles
  - profile-names-and-avatars-within-policy
  - context-defaults
  - profile-selection-ui
  - voice-provider-mapping
  - supported-locales-and-voices
  - saved-preference-behavior
  - feature-flag-and-experiment-rollout
  - accessibility-variants
  - consent-record-reference-for-real-person-based-presentation

implementation_truth:
  implemented: false
  not_yet_implemented:
    - character-selection-ui
    - avatar-switching
    - voice-synthesis-profile-mapping
    - saved-character-preferences
    - saved-voice-preferences
    - consent-record-storage
    - context-based-profile-defaulting
    - automatic-profile-switching
  note: architecture-only; not a GlenTown Beta prerequisite
