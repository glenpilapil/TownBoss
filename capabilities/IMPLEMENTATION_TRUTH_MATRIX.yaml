version: 1
status: audited-2026-09-04
owner: TownBoss
purpose: >-
  Record implementation evidence separately from canonical architecture status so
  product-local behavior, thin adapters, client surfaces, and physically shared
  runtimes are not conflated.

invariants:
  - implemented-in-one-product-does-not-equal-shared-capability-extracted
  - client-surface-does-not-equal-server-enforcement
  - architecture-status-does-not-equal-runtime-status
  - local-pattern-does-not-equal-portfolio-runtime
  - thin-adapter-does-not-equal-full-capability-implementation
  - documentation-does-not-equal-runtime
  - missing-runtime-does-not-invalidate-canonical-architecture

runtime_status_classes:
  implemented: material runtime implementing the relevant capability exists
  implemented-partial: meaningful subset exists but capability is incomplete
  product-level-patterns: local domain behavior exhibits canonical semantics without shared runtime
  adapter-enforcement: thin adapter or enforcement boundary to canonical contract exists
  client-surface-only: client/UI behavior exists but server-side enforcement is not established by it
  distributed-incomplete: behavior is spread across framework/domain components without complete capability runtime
  scaffold-only: service/application boundary exists but material domain behavior is not implemented
  not-verified: no qualifying runtime evidence found in audited repositories
  not-audited-no-repository: no standalone repository was available in this pass

audited_repository_refs:
  TownBoss:
    branch: main
    commit: 6e7691ae77bbda50a744435a71b22ed2b9b334f2
  GlenTown-API:
    branch: master
    commit: 25468cda8ed0619b7e11b891689cf7d00a3223b6
  GlenTown-App:
    branch: main
    commit: 8454449d19c55881ac11471873aa4899e16d53c9
  GeoPlotter-Real-Estate:
